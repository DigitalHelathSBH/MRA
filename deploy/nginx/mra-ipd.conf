# Nginx reverse proxy สำหรับ MRA IPD — แก้ server_name และ path ใบรับรองให้ตรงกับ server จริง
server {
    listen 80;
    server_name mra-ipd.example.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name mra-ipd.example.local;

    ssl_certificate     /etc/nginx/ssl/mra-ipd.crt;
    ssl_certificate_key /etc/nginx/ssl/mra-ipd.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # ใช้บันทึก IP ใน mra.AccessLog
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
