# วางไฟล์นี้ที่ /etc/nginx/conf.d/mra-logformat.conf (ระดับ http)
# log ของ /mra ไม่เก็บ query string เพราะช่องค้นหาอาจมี HN
log_format mra_noquery '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                       '$status $body_bytes_sent "$http_user_agent"';
