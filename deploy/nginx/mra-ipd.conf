# Nginx reverse proxy สำหรับ MRA IPD — แก้ server_name และ path ใบรับรองให้ตรงกับ server จริง
# header ความปลอดภัย (X-Frame-Options, nosniff, Referrer-Policy, Cache-Control) ตั้งในแอปแล้ว (next.config.mjs)

# ไม่เก็บ query string ใน access log (ช่องค้นหาอาจมี HN)
log_format mra_noquery '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                       '$status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    server_name mra-ipd.example.local;
    return 301 https://$host$request_uri;
}

server {
    # Nginx < 1.25.1 ใช้แบบนี้ · ถ้า ≥ 1.25.1 เปลี่ยนเป็น "listen 443 ssl;" + "http2 on;" ได้
    listen 443 ssl http2;
    server_name mra-ipd.example.local;

    ssl_certificate     /etc/nginx/ssl/mra-ipd.crt;
    ssl_certificate_key /etc/nginx/ssl/mra-ipd.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/mra-ipd.access.log mra_noquery;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # ส่ง IP จริงของผู้ใช้ค่าเดียว (ไม่ต่อท้ายค่าที่ client ส่งมา จึงปลอมไม่ได้) — ใช้บันทึกใน mra.AccessLog
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
