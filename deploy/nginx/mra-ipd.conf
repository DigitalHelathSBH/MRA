# Nginx สำหรับ MRA IPD บน server ภายใน (HTTP) เว็บอยู่ที่ http://10.0.120.17/mra
# วางไฟล์นี้ใน /etc/nginx/conf.d/ หรือคัดลอกเฉพาะ location ไปใส่ใน server block ที่มีอยู่แล้ว
# ไม่มี HTTPS จึงต้องตั้ง COOKIE_SECURE=false ใน .env
# header ความปลอดภัย (X-Frame-Options, nosniff, Referrer-Policy, Cache-Control) ตั้งในแอปแล้ว

# ไม่เก็บ query string ใน access log (ช่องค้นหาอาจมี HN)
log_format mra_noquery '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                       '$status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    server_name 10.0.120.17;

    access_log /var/log/nginx/mra-ipd.access.log mra_noquery;
    client_max_body_size 2m;

    # ส่งต่อทั้ง path (/mra และ /mra/...) ให้แอป เพราะแอป build ด้วย BASE_PATH=/mra
    # (ไม่ redirect /mra → /mra/ เอง เพราะแอปตัด / ท้ายออก จะวนกัน)
    location /mra {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # IP จริงของผู้ใช้ค่าเดียว (กันปลอม) — ใช้บันทึกใน mra.AccessLog
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
