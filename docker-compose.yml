# ใช้: TAG=$(git rev-parse --short HEAD) docker compose up -d --build
# (ไฟล์ .env อยู่ข้างไฟล์นี้บน server ห้าม commit)
services:
  mra-ipd:
    build:
      context: .
      args:
        BASE_PATH: ${BASE_PATH:-/mra}   # ต้องตรงกับ location ใน Nginx
    image: mra-ipd:${TAG:-latest}   # ใส่ tag ตาม commit เพื่อ rollback ได้โดยไม่ต้อง build ใหม่
    container_name: mra-ipd
    env_file: .env
    environment:
      TZ: Asia/Bangkok
    ports:
      - "127.0.0.1:${APP_PORT:-3310}:3000"   # เปิดเฉพาะในเครื่อง ให้ Nginx เป็นทางเข้า (3000/3001 บน server มีระบบอื่นใช้)
    restart: unless-stopped
    healthcheck:
      # หน้า login อยู่ใต้ BASE_PATH (เช่น /mra/login) — BASE_PATH มาจาก .env
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:3000$${BASE_PATH:-}/login || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
