# ใส่ block นี้ใน server { server_name 10.0.120.17; } ของ /etc/nginx/conf.d/sbh.conf
# เว็บ: http://10.0.120.17/mra  (แอป build ด้วย BASE_PATH=/mra และรันที่ 127.0.0.1:3310)
# ไม่ redirect /mra → /mra/ เอง เพราะแอปตัด / ท้ายออก จะวนกัน

    location ^~ /mra {
        proxy_pass http://127.0.0.1:3310;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # IP จริงของผู้ใช้ค่าเดียว (กันปลอม) — ใช้บันทึกใน mra.AccessLog
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log /var/log/nginx/mra-ipd.access.log mra_noquery;
        client_max_body_size 2m;
    }
